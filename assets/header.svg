<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" role="img" aria-label="Maria Clara - Engenharia de Software na UFC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191627"/>
      <stop offset="55%" stop-color="#2a1b3d"/>
      <stop offset="100%" stop-color="#3d1f45"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9a9e"/>
      <stop offset="50%" stop-color="#fecfef"/>
      <stop offset="100%" stop-color="#ffb6c1"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff8e1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff8e1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:1; } }
    @keyframes floatUp { 0% { transform: translateY(0); opacity:0; } 12% { opacity:.85; } 100% { transform: translateY(-52px); opacity:0; } }
    @keyframes caretBlink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes glowPulse { 0%,100% { opacity:.5; } 50% { opacity:1; } }
    .star { animation: twinkle 2.6s ease-in-out infinite; }
    .paw  { animation: floatUp 3.4s ease-in infinite; }
    .caret { animation: caretBlink 1.05s steps(1) infinite; }
    .titleText {
      fill: none;
      stroke: url(#titleGrad);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 4000;
      stroke-dashoffset: 4000;
      animation: draw 3.2s ease-out forwards;
    }
    .moon { animation: glowPulse 4s ease-in-out infinite; }
  </style>

  <rect width="800" height="250" fill="url(#bg)"/>

  <!-- estrelas -->
  <circle class="star" cx="60"  cy="42" r="2"  fill="#fff" style="animation-delay:.2s"/>
  <circle class="star" cx="150" cy="30" r="1.6" fill="#fff" style="animation-delay:1.1s"/>
  <circle class="star" cx="240" cy="60" r="2.2" fill="#fff" style="animation-delay:.6s"/>
  <circle class="star" cx="330" cy="25" r="1.4" fill="#fff" style="animation-delay:1.6s"/>
  <circle class="star" cx="420" cy="48" r="1.8" fill="#fff" style="animation-delay:.9s"/>
  <circle class="star" cx="520" cy="32" r="2"  fill="#fff" style="animation-delay:2.1s"/>
  <circle class="star" cx="610" cy="70" r="1.5" fill="#fff" style="animation-delay:1.3s"/>
  <circle class="star" cx="90"  cy="90" r="1.4" fill="#fff" style="animation-delay:2.4s"/>
  <circle class="star" cx="470" cy="95" r="1.6" fill="#fff" style="animation-delay:.4s"/>
  <circle class="star" cx="30"  cy="120" r="1.5" fill="#fff" style="animation-delay:1.8s"/>
  <circle class="star" cx="700" cy="120" r="1.6" fill="#fff" style="animation-delay:2.7s"/>
  <circle class="star" cx="560" cy="18" r="1.3" fill="#fff" style="animation-delay:3s"/>

  <!-- lua -->
  <circle class="moon" cx="700" cy="58" r="70" fill="url(#moonGlow)"/>
  <circle cx="700" cy="58" r="26" fill="#fff8e1"/>
  <circle cx="712" cy="52" r="22" fill="#2a1b3d"/>

  <!-- patinhas flutuando -->
  <g class="paw" style="animation-delay:0s" fill="#f472b6" fill-opacity=".75">
    <ellipse cx="0" cy="0" rx="9"  ry="12"/>
    <circle cx="-8" cy="-13" r="3.6"/>
    <circle cx="-1" cy="-17" r="4.2"/>
    <circle cx="7"  cy="-14" r="3.6"/>
  </g>
  <g class="paw" transform="translate(190,0)" style="animation-delay:.9s" fill="#e0aaff" fill-opacity=".7">
    <ellipse cx="0" cy="0" rx="8"  ry="11"/>
    <circle cx="-7" cy="-12" r="3.2"/>
    <circle cx="-1" cy="-16" r="3.8"/>
    <circle cx="6"  cy="-13" r="3.2"/>
  </g>
  <g class="paw" transform="translate(400,0)" style="animation-delay:1.8s" fill="#f472b6" fill-opacity=".7">
    <ellipse cx="0" cy="0" rx="9"  ry="12"/>
    <circle cx="-8" cy="-13" r="3.6"/>
    <circle cx="-1" cy="-17" r="4.2"/>
    <circle cx="7"  cy="-14" r="3.6"/>
  </g>
  <g class="paw" transform="translate(610,0)" style="animation-delay:2.6s" fill="#e0aaff" fill-opacity=".75">
    <ellipse cx="0" cy="0" rx="8"  ry="11"/>
    <circle cx="-7" cy="-12" r="3.2"/>
    <circle cx="-1" cy="-16" r="3.8"/>
    <circle cx="6"  cy="-13" r="3.2"/>
  </g>

  <!-- título -->
  <text class="titleText" x="400" y="105" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="44" font-weight="700">Olá, eu sou a Maria Clara</text>

  <!-- subtítulo -->
  <text x="372" y="150" text-anchor="middle" font-family="Consolas, monospace, sans-serif" font-size="17" fill="#d8b4fe">Eng. de Software @ UFC | Web Dev &amp; Cybersegurança</text>
  <rect class="caret" x="636" y="137" width="9" height="19" rx="1.5" fill="#fecfef"/>

  <!-- tagline -->
  <text x="400" y="188" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="15" font-style="italic" fill="#a78bfa">transformando café em código ☕ e pausas em carinho de pets 🐾</text>
</svg>
